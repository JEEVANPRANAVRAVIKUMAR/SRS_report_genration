version: '3.8'

services:
  srs-solar-log:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: srs-solar-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - APP_ENV=production
      - TIMEZONE=Asia/Kolkata
      - PORT=8000
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
