[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "srs-solar-log"
version = "0.1.0"
description = "SRS Solar Daily Log - Daily Generation Logger and Report Generator for M/s. SRS KUMARAN INDIA PVT LTD"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "sqlalchemy>=2.0.0",
    "xlsxwriter>=3.1.0",
    "reportlab>=4.0.0",
    "apscheduler>=3.10.0",
    "httpx>=0.25.0",
    "passlib>=1.7.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
srs-solar = "app.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
