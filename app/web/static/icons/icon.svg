<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#F59E0B" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Sun Rays & Core -->
  <g filter="url(#glow)">
    <circle cx="256" cy="190" r="64" fill="url(#sunGrad)"/>
    <!-- 8 Sun Rays -->
    <path d="M256 90 L256 112 M256 268 L256 290 M156 190 L178 190 M334 190 L356 190 M185 119 L201 135 M311 245 L327 261 M185 261 L201 245 M311 135 L327 119" 
          stroke="#FBBF24" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- Solar Panel Grid in Perspective -->
  <g transform="translate(0, 40)">
    <polygon points="128,340 384,340 432,420 80,420" fill="url(#panelGrad)" stroke="#60A5FA" stroke-width="6"/>
    <!-- Panel Grid Dividers -->
    <line x1="256" y1="340" x2="256" y2="420" stroke="#93C5FD" stroke-width="4"/>
    <line x1="192" y1="340" x2="168" y2="420" stroke="#93C5FD" stroke-width="3"/>
    <line x1="320" y1="340" x2="344" y2="420" stroke="#93C5FD" stroke-width="3"/>
    <line x1="104" y1="380" x2="408" y2="380" stroke="#93C5FD" stroke-width="4"/>
  </g>
</svg>
